<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Сайт | Stark Industries</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ffcc;
            font-family: 'Consolas', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #00aaff;
            text-shadow: 0 0 10px #00aaff;
        }
        .container {
            width: 80%;
            max-width: 800px;
            background: #111;
            padding: 20px;
            border: 1px solid #00aaff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.2);
        }
        .message {
            background: #1a1a1a;
            border-left: 4px solid #00aaff;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .message .name {
            color: #ffffff;
            font-weight: bold;
        }
        .message .text {
            color: #aaaaaa;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        input, textarea {
            background: #222;
            border: 1px solid #00aaff;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-family: inherit;
        }
        button {
            background: #00aaff;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        button:hover {
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="/static/Jarvis.exe" download style="background-color: #ff0055; color: white; padding: 15px 30px; text-decoration: none; font-size: 20px; border-radius: 5px; box-shadow: 0 0 15px #ff0055; font-weight: bold;">
            СКАЧАТЬ J.A.R.V.I.S (v3.0)
        </a>
    </div>
    <h1>J.A.R.V.I.S. CHAT</h1>
    <div class="container">
        <h2>Сообщения:</h2>
        <div id="messages">
            {% for msg in messages %}
            <div class="message">
                <span class="name">{{ msg.name }}:</span>
                <span class="text">{{ msg.text }}</span>
            </div>
            {% endfor %}
        </div>

        <h2>Оставить сообщение:</h2>
        <form action="/add" method="POST">
            <input type="text" name="name" placeholder="Ваше имя" required>
            <textarea name="text" placeholder="Ваше сообщение" required></textarea>
            <button type="submit">Отправить</button>
        </form>
    </div>
</body>
</html>
